[package]
name = "polars-cli"
version = "0.2.0"
edition = "2024"
default-run = "pl"

[features]
default = ["database"]
# `pl db`: read-only queries against PostgreSQL, MySQL/MariaDB, and SQLite.
# The only code in `pl` that opens network connections or reads credentials; see ADR 0003.
database = ["dep:chrono", "dep:futures-util", "dep:sqlx", "dep:tokio", "dep:url"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.41", default-features = false, optional = true }
clap = { version = "4.5.41", features = ["derive", "env"] }
clap_complete = "4.6.9"
futures-util = { version = "0.3.32", default-features = false, optional = true }
htmd = "0.5.4"
polars = { version = "0.53.0", features = [
    "abs",
    "arg_where",
    "avro",
    "bitwise",
    "concat_str",
    "cross_join",
    "csv",
    "cum_agg",
    "cutqcut",
    "diagonal_concat",
    "dtype-array",
    "dtype-categorical",
    "dtype-date",
    "dtype-datetime",
    "dtype-decimal",
    "dtype-duration",
    "dtype-i16",
    "dtype-i8",
    "dtype-struct",
    "dtype-time",
    "dtype-u128",
    "dtype-u16",
    "dtype-u8",
    "dynamic_group_by",
    "iejoin",
    "ipc",
    "is_in",
    "is_unique",
    "json",
    "lazy",
    "log",
    "parquet",
    "pivot",
    "random",
    "range",
    "regex",
    "replace",
    "rolling_window",
    "round_series",
    "semi_anti_join",
    "sign",
    "sql",
    "string_to_integer",
    "strings",
    "temporal",
    "timezones",
    "to_dummies",
    "trigonometry",
    "unique_counts",
] }
pulldown-cmark = "0.13.3"
regex = "1.12.3"
roxmltree = "0.21.1"
scraper = "0.26.0"
serde_json = "1.0.149"
sqlx = { version = "0.9.0", default-features = false, optional = true, features = [
    "mysql",
    "postgres",
    "runtime-tokio",
    "sqlite-bundled",
    "tls-rustls-ring-native-roots",
] }
tokio = { version = "1.52.0", default-features = false, optional = true, features = [
    "rt",
    "time",
] }
toml = "0.9.8"
url = { version = "2.5.8", optional = true }
yaml_serde = "0.10.7"

[lib]
name = "polars_cli"
path = "src/lib.rs"

[[bin]]
name = "pl"
path = "src/bin/pl.rs"

[[bin]]
name = "polars"
path = "src/bin/polars.rs"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
serde_json = "1.0.149"
tempfile = "3.23.0"
