[package]
name = "polars-cli"
version = "0.1.0"
edition = "2024"
default-run = "pl"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.41", features = ["derive"] }
htmd = "0.5.4"
polars = { version = "0.53.0", features = ["csv", "json", "lazy", "sql"] }
pulldown-cmark = "0.13.3"
roxmltree = "0.21.1"
scraper = "0.26.0"
serde_json = "1.0.149"
toml = "0.9.8"

[lib]
name = "polars_cli"
path = "src/lib.rs"

[[bin]]
name = "pl"
path = "src/bin/pl.rs"

[[bin]]
name = "polars"
path = "src/bin/polars.rs"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
serde_json = "1.0.149"
tempfile = "3.23.0"
