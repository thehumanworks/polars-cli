name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Require the tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="polars-cli") | .version')"
          if [ "$pkg" != "$tag" ]; then
            echo "Cargo.toml version ($pkg) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi

      - name: Compile
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          bin_dir="target/${target}/release"
          name="polars-cli-v${version}-${target}"
          mkdir -p dist
          if [[ "$target" == *windows* ]]; then
            ext=".exe"
            "${bin_dir}/pl${ext}" --version | grep -F " ${version}"
            "${bin_dir}/polars${ext}" --version | grep -F " ${version}"
            py=python3
            command -v python3 >/dev/null 2>&1 || py=python
            "$py" -c 'import os, sys, zipfile; z = zipfile.ZipFile(sys.argv[1], "w", compression=zipfile.ZIP_DEFLATED); [z.write(p, os.path.basename(p)) for p in sys.argv[2:]]' \
              "dist/${name}.zip" "${bin_dir}/pl${ext}" "${bin_dir}/polars${ext}"
          else
            "${bin_dir}/pl" --version | grep -F " ${version}"
            "${bin_dir}/polars" --version | grep -F " ${version}"
            tar -C "$bin_dir" -czf "dist/${name}.tar.gz" pl polars
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum polars-cli-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Release v${version} of \`polars-cli\`.

          Each archive contains both binaries: \`pl\` and \`polars\` (\`.exe\` on Windows).

          | Asset | Target |
          | --- | --- |
          | \`polars-cli-v${version}-x86_64-unknown-linux-gnu.tar.gz\` | Linux x86_64 |
          | \`polars-cli-v${version}-aarch64-apple-darwin.tar.gz\` | macOS Apple Silicon |
          | \`polars-cli-v${version}-x86_64-pc-windows-msvc.zip\` | Windows x86_64 |

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "v${version}" \
            --notes-file "$notes" \
            --verify-tag
