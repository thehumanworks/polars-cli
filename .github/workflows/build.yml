name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - name: macos-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Verify binaries
        shell: bash
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          ext="${{ matrix.bin_ext }}"
          "${bin_dir}/pl${ext}" --version
          "${bin_dir}/polars${ext}" --version
          "${bin_dir}/pl${ext}" --help
          "${bin_dir}/polars${ext}" --help

      - name: Package binaries
        shell: bash
        run: |
          dest="dist/${{ matrix.name }}"
          mkdir -p "$dest"
          bin_dir="target/${{ matrix.target }}/release"
          ext="${{ matrix.bin_ext }}"
          cp "${bin_dir}/pl${ext}" "${dest}/pl${ext}"
          cp "${bin_dir}/polars${ext}" "${dest}/polars${ext}"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: polars-cli-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          if-no-files-found: error
