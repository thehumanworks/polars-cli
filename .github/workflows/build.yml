name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pl
          POSTGRES_PASSWORD: pl
          POSTGRES_DB: pl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pl -d pl_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pl_test
          MYSQL_USER: pl
          MYSQL_PASSWORD: pl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u pl -ppl"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Polars debug info would fill the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      PL_TEST_POSTGRES_URL: postgres://pl:pl@127.0.0.1:5432/pl_test
      PL_TEST_MYSQL_URL: mysql://pl:pl@127.0.0.1:3306/pl_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --locked

      - name: Test without the database feature
        run: cargo test --locked --no-default-features

  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - name: macos-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Verify binaries
        shell: bash
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          ext="${{ matrix.bin_ext }}"
          "${bin_dir}/pl${ext}" --version
          "${bin_dir}/polars${ext}" --version
          "${bin_dir}/pl${ext}" --help
          "${bin_dir}/polars${ext}" --help

      - name: Package binaries
        shell: bash
        run: |
          dest="dist/${{ matrix.name }}"
          mkdir -p "$dest"
          bin_dir="target/${{ matrix.target }}/release"
          ext="${{ matrix.bin_ext }}"
          cp "${bin_dir}/pl${ext}" "${dest}/pl${ext}"
          cp "${bin_dir}/polars${ext}" "${dest}/polars${ext}"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: polars-cli-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          if-no-files-found: error
